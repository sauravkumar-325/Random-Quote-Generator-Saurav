
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quote-box">
        <h1>Random Quote Generator</h1>

        <p id="quote">Click the button to get a quote!</p>
        <h3 id="author">— Author</h3>

        <div class="buttons">
    <button id="newQuote">New Quote</button>
    <button id="copyQuote">Copy Quote</button>
    <button id="favoriteQuote">♡ Add to Favorites</button>
    <button id="showFavorites">View Favorites</button>
</div>

<p id="message"></p>

<div id="favoritesSection" hidden>
    <h2>My Favorite Quotes</h2>
    <div id="favoritesList"></div>
</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
